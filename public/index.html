<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Aplikacja</title>
</head>
<body>
    <h1>Dane studenta</h1>
    <div id="dane">
        Logowanie...
    </div>

    <script>
        fetch('api/hello')
            .then(response => response.json())
            .then(data => {
                document.getElementById('dane').innerHTML = `
                <p><strong>Imię:</strong> ${data.imie}</p>
                <p><strong>Nazwisko:</strong> ${data.nazwisko}</p>
                    <p><strong>Numer indeksu:</strong> ${data.numerIndeksu}</p>
                `;
            })
            .catch(error => {
                document.getElementById('dane').innerHTML = 'Błąd ładowania danych';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
